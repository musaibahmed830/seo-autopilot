name: Daily autopilot

on:
  schedule:
    - cron: "0 3 * * *"   # every day 03:00 UTC = 8:00 AM Pakistan time
  workflow_dispatch:       # manual run button in the Actions tab

permissions:
  contents: write

concurrency: autopilot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit sites and create draft posts
        run: python scripts/run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}

      - name: Save dashboard data
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Daily data $(date -u +%F)" && git push)
