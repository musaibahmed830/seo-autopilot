name: Autopilot

on:
  schedule:
    - cron: "17 * * * *"   # every hour (checks trends and the best posting slot)
  workflow_dispatch:       # manual run = full report + post now

permissions:
  contents: write

concurrency: autopilot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-auth requests

      - name: Run autopilot
        run: python scripts/run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Save dashboard data
        run: |
          git config user.name "autopilot[bot]"
          git config user.email "autopilot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Autopilot data $(date -u +%F-%H)" && git push)
