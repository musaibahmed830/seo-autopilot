<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Autopilot Dashboard</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1d1b1a;--mut:#7a746f;--ac:#b4235a;--ac2:#2b6cb0;--ln:#e8e2dc;--ok:#1f8a4c;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#17151a;--card:#221f26;--tx:#f1ece8;--mut:#a39c96;--ac:#f06aa0;--ac2:#6cb0f0;--ln:#37323c;--ok:#4cc27f;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0}h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--mut);font-size:13px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.top a{font-size:13px;color:var(--ac);margin-left:10px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.g{grid-template-columns:repeat(4,1fr)}}
.st{border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
ul{margin:0;padding-left:18px}li{margin:3px 0;font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
svg{width:100%;height:auto;display:block}
.leg{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.empty{color:var(--mut);padding:20px 0;text-align:center}
</style>
</head>
<body>
<div class="w">
<h1>SEO Autopilot Dashboard</h1>
<div class="sub" id="upd">Loading...</div>
<div id="app"></div>
</div>
<script>
const app=document.getElementById('app');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
function chart(vals,labels,color,fixedMax){
  const n=vals.length,mx=fixedMax||Math.max(1,...vals.filter(v=>v!=null));
  const W=300,X=i=>n>1?i*(W/(n-1)):W/2,Y=v=>80-v/mx*70;
  let pts=[],dots='';
  vals.forEach((v,i)=>{if(v!=null){pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1));dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.5" fill="'+color+'"/>'}});
  const d=document.createElement('div');
  d.innerHTML='<svg viewBox="0 0 300 90"><line x1="0" y1="80" x2="300" y2="80" stroke="currentColor" opacity=".2"/><polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts.join(' ')+'"/>'+dots+'</svg>';
  const l=el('div','leg');l.append(el('span','',labels[0]||''),el('span','','max '+mx),el('span','',labels[n-1]||''));
  d.append(l);return d;
}
function stat(v,l){const s=el('div','st');s.append(el('b','',v==null?'-':v),el('span','',l));return s}
function site(name,s){
  const days=s.days||[],last=days[days.length-1]||{};
  const c=el('div','card'),top=el('div','top');
  top.append(el('h2','',name));
  const lk=el('div');
  const a1=el('a','','Open site');a1.href=s.site;a1.target='_blank';
  const a2=el('a','','Review drafts');a2.href='https://github.com/'+s.repo+'/pulls';a2.target='_blank';
  lk.append(a1,a2);top.append(lk);c.append(top);
  const g=el('div','g');
  g.append(stat(last.perf,'Mobile speed (0-100)'),stat(last.seo,'SEO score (0-100)'),stat(last.merged_30d,'Posts published, 30 days'),stat(last.drafts_open,'Drafts waiting for you'));
  c.append(g);
  const g2=el('div','g');g2.style.marginTop='10px';
  g2.append(stat(last.merged_total,'Posts published, total'),stat(last.sitemap_urls,'Pages in sitemap'),stat(last.links_broken,'Broken links found'),stat(last.sitemap_newest,'Newest page date'));
  c.append(g2);
  if(last.pr_url){const p=el('p','', 'New draft today: ');const a=el('a','','open it');a.href=last.pr_url;a.target='_blank';p.append(a);c.append(p)}
  c.append(el('h3','','Problems found on the site (latest run)'));
  const iss=last.issues||[];
  if(!iss.length){c.append(el('div','ok','No problems found'))}
  else{const u=el('ul');iss.forEach(t=>u.append(el('li','bad',t)));c.append(u)}
  if(days.length>1){
    const lb=days.map(d=>d.date.slice(5));
    c.append(el('h3','','Mobile speed score'));c.append(chart(days.map(d=>d.perf??null),lb,'#b4235a',100));
    c.append(el('h3','','Posts published (last 30 days, rolling)'));c.append(chart(days.map(d=>d.merged_30d??null),lb,'#2b6cb0'));
  }
  const nt=last.notes||[];
  if(nt.length){c.append(el('h3','','Run notes'));const u=el('ul');nt.forEach(t=>u.append(el('li','',t)));c.append(u)}
  return c;
}
fetch('data/history.json?'+Date.now()).then(r=>r.json()).then(h=>{
  document.getElementById('upd').textContent='Last updated: '+(h.updated||'never');
  const names=Object.keys(h.sites||{});
  if(!names.length){app.append(el('div','empty','Abhi koi data nahi. Actions tab mein "Daily autopilot" ko Run workflow karo.'));return}
  names.forEach(n=>app.append(site(n,h.sites[n])));
}).catch(()=>{document.getElementById('upd').textContent='';app.append(el('div','empty','Data load nahi hua. Pages setting aur docs/data/history.json check karo.'))});
</script>
</body>
</html>
